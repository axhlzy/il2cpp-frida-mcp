[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "il2cpp-frida-mcp"
version = "1.0.0"
description = "MCP Server for IL2CPP reverse engineering with Frida"
readme = "README_EN.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["il2cpp", "frida", "mcp", "reverse-engineering", "unity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "frida>=17.5.2",
    "mcp>=1.26.0",
    "starlette>=0.52.1",
    "uvicorn>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.0.270",
]

[project.scripts]
il2cpp-frida-mcp = "mcp_server.__main__:main"

[project.urls]
Homepage = "https://github.com/axhlzy/il2cpp-frida-mcp"
Repository = "https://github.com/axhlzy/il2cpp-frida-mcp"

[tool.setuptools.packages.find]
include = ["mcp_server*"]

[tool.setuptools.package-data]
mcp_server = ["py.typed", "_agent.js"]
